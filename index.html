<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TNT Roadside</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 48px;
    }
    header {
      text-align: center;
      margin: 32px 0 40px;
    }
    header h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    header h1 span { color: #f97316; }
    header p {
      margin-top: 8px;
      color: #94a3b8;
      font-size: 15px;
    }
    .services {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .service-btn {
      display: flex;
      align-items: center;
      gap: 16px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 20px;
      text-align: left;
      color: #f8fafc;
      cursor: pointer;
      transition: border-color 0.15s ease, transform 0.1s ease;
    }
    .service-btn:hover {
      border-color: #f97316;
      transform: translateY(-1px);
    }
    .service-btn .icon {
      font-size: 28px;
      width: 48px;
      text-align: center;
    }
    .service-btn .label {
      font-size: 17px;
      font-weight: 600;
    }
    .service-btn .sub {
      font-size: 13px;
      color: #94a3b8;
      margin-top: 2px;
    }
    footer {
      margin-top: 48px;
      color: #64748b;
      font-size: 13px;
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <h1>TNT <span>Roadside</span></h1>
    <p>Mobile roadside help &mdash; Gulfport &amp; Biloxi, MS</p>
  </header>

  <main class="services">
    <button class="service-btn" data-service="flat_tire">
      <div class="icon">&#128664;</div>
      <div>
        <div class="label">Flat Tire</div>
        <div class="sub">Tire change or repair on the spot</div>
      </div>
    </button>

    <button class="service-btn" data-service="dead_battery">
      <div class="icon">&#128267;</div>
      <div>
        <div class="label">Dead Battery</div>
        <div class="sub">Jump start to get you moving again</div>
      </div>
    </button>

    <button class="service-btn" data-service="lockout">
      <div class="icon">&#128273;</div>
      <div>
        <div class="label">Locked Out</div>
        <div class="sub">Get back into your vehicle fast</div>
      </div>
    </button>
  </main>

  <footer>
    &copy; 2026 TNT Roadside. Available 7 days a week.
  </footer>
</body>
</html>
