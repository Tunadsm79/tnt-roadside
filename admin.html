<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>T&amp;T Roadside &mdash; Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 48px;
    }
    .card {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: center;
      text-align: center;
    }
    h1 { font-size: 22px; font-weight: 800; }
    h1 span { color: #E01010; }
    p.sub { color: #94a3b8; font-size: 14px; }
    input[type="password"] {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #f8fafc;
      font-size: 18px;
      text-align: center;
      letter-spacing: 4px;
    }
    button {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: none;
      background: #2563EB;
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    button.secondary {
      background: transparent;
      border: 1px solid #334155;
      color: #94a3b8;
    }
    button:disabled { opacity: 0.5; cursor: default; }
    .status {
      font-size: 14px;
      color: #94a3b8;
      min-height: 20px;
    }
    .status.error { color: #f87171; }
    .hidden { display: none !important; }
    #dashboard-screen { width: 100%; text-align: left; }

    .top-row {
      display: flex;
      gap: 8px;
      width: 100%;
      margin-bottom: 16px;
    }
    .top-row button { padding: 10px; font-size: 13px; }

    .summary-strip {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      width: 100%;
    }
    .summary-total { font-size: 26px; font-weight: 800; color: #4ade80; }
    .summary-sub { font-size: 13px; color: #94a3b8; margin-top: 2px; }
    .status-counts {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }
    .status-count {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 12px;
      color: #cbd5e1;
    }
    .status-count strong { color: #f8fafc; }

    .filter-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      width: 100%;
      margin-bottom: 16px;
    }
    .filter-btn {
      width: auto;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 700;
      background: transparent;
      border: 1px solid #334155;
      color: #94a3b8;
    }
    .filter-btn.active {
      background: #2563EB;
      border-color: #2563EB;
      color: #ffffff;
    }

    #job-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .job-card {
      width: 100%;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 14px 16px;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 6px;
      cursor: pointer;
    }
    .job-card:active { opacity: 0.85; }
    /* Job-detail expand panel (added 2026-09-26): tap a job card to open
       this -- lets admin cancel the job (releases the Stripe hold) or
       hand it to a different on-duty tech, without needing the tech's
       phone at all. Same visual language as .tech-detail above. */
    .job-detail {
      margin-top: 4px;
      padding-top: 10px;
      border-top: 1px solid #334155;
      display: flex;
      flex-direction: column;
      gap: 8px;
      cursor: default;
    }
    .job-detail-row { font-size: 12px; color: #94a3b8; }
    .job-detail-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    .job-detail-actions button { width: auto; padding: 8px 14px; font-size: 13px; }
    .job-detail-actions select {
      flex: 1;
      min-width: 140px;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #f8fafc;
      font-size: 13px;
    }
    button.danger { background: #b91c1c; }
    button.danger:disabled { opacity: 0.5; }
    /* Read-only view of the customer<->tech chat thread for a job,
       added 2026-09-26 per Demian: "I want to be able to see whatever
       message the customer is sending through the admin page" without
       needing either phone. Reuses the same GET /api/messages endpoint
       index.html/tech.html already poll -- no new serverless function. */
    .job-messages {
      max-height: 160px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 4px 2px;
    }
    .job-msg {
      max-width: 85%;
      padding: 8px 10px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.35;
      word-wrap: break-word;
    }
    .job-msg-sender {
      display: block;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      opacity: 0.7;
      margin-bottom: 2px;
    }
    .job-msg.customer {
      align-self: flex-start;
      background: #1e293b;
      border: 1px solid #334155;
    }
    .job-msg.tech {
      align-self: flex-end;
      background: #1e3a8a;
      color: #dbeafe;
    }
    .job-service { font-size: 16px; font-weight: 800; }
    .job-badge {
      display: inline-block;
      margin-left: 8px;
      vertical-align: middle;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
    }
    .job-badge.requested { background: #7c2d12; color: #fed7aa; }
    .job-badge.dispatched { background: #14532d; color: #86efac; }
    .job-badge.en_route { background: #1e3a8a; color: #bfdbfe; }
    .job-badge.arrived { background: #581c87; color: #e9d5ff; }
    .job-badge.completed { background: #14532d; color: #4ade80; }
    .job-badge.cancelled { background: #3f1d1d; color: #f87171; }
    .job-price { color: #2563EB; font-weight: 700; font-size: 14px; }
    .job-meta { font-size: 12px; color: #94a3b8; }
    .no-jobs { color: #64748b; font-size: 14px; padding: 20px 0; text-align: center; width: 100%; }
    .tech-section {
      width: 100%;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .tech-section-title {
      font-size: 13px;
      font-weight: 800;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }
    .tech-map {
      width: 100%;
      height: 200px;
      border-radius: 10px;
      margin-bottom: 12px;
      background: #0f172a;
    }
    .tech-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 0;
      border-top: 1px solid #334155;
    }
    .tech-row:first-of-type { border-top: none; }
    .tech-name { font-size: 14px; font-weight: 700; }
    .tech-meta { font-size: 12px; color: #64748b; margin-top: 2px; }
    .tech-pill {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 999px;
      flex-shrink: 0;
    }
    .tech-pill.on { background: #14532d; color: #86efac; }
    .tech-pill.off { background: #334155; color: #94a3b8; }
    .tech-row { cursor: pointer; }
    .tech-row:active { opacity: 0.8; }
    .tech-detail {
      margin-top: 4px;
      margin-bottom: 12px;
      padding: 12px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
    }
    .tech-detail-name { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
    .tech-detail-meta { font-size: 12px; color: #94a3b8; margin-bottom: 4px; }
    .tech-detail-note { font-size: 12px; color: #64748b; margin-bottom: 10px; }
    .tech-detail button {
      width: auto;
      padding: 8px 16px;
      font-size: 13px;
      margin-right: 8px;
    }
    .tech-detail button.off-duty-btn { background: #334155; color: #e2e8f0; }
    .install-banner {
      display: none;
      align-items: center;
      gap: 12px;
      width: 100%;
      background: #1e293b;
      border: 1px solid #2563EB;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 20px;
    }
    .install-banner-text {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .install-banner-text strong {
      font-size: 14px;
      color: #f8fafc;
    }
    .install-banner-text span {
      font-size: 13px;
      color: #94a3b8;
      line-height: 1.4;
    }
    .install-banner-btn {
      width: auto;
      flex-shrink: 0;
      background: #2563EB;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .install-banner-close {
      width: auto;
      flex-shrink: 0;
      background: none;
      border: none;
      color: #64748b;
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
      padding: 4px;
    }
  </style>
  <link rel="manifest" href="/admin-manifest.json">
  <meta name="theme-color" content="#0f172a">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="T&amp;T Admin">
</head>
<body>
  <div class="card">
    <h1>T&amp;T <span>Roadside</span> &mdash; Admin</h1>

    <div class="install-banner" id="install-banner">
      <div class="install-banner-text">
        <strong>Install T&amp;T Admin</strong>
        <span id="install-banner-sub">Add this to your home screen for one-tap access.</span>
      </div>
      <button class="install-banner-btn" id="install-btn">Install</button>
      <button class="install-banner-close" id="install-dismiss" aria-label="Dismiss">&times;</button>
    </div>

    <div id="pin-screen">
      <p class="sub">Admin dashboard &mdash; owner access only</p>
      <input type="password" id="pin-input" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="PIN">
      <div class="status error" id="pin-status"></div>
      <button id="pin-submit">Unlock</button>
    </div>

    <div id="dashboard-screen" class="hidden">
      <div class="top-row">
        <button class="secondary" id="refresh-btn">&#8635; Refresh</button>
        <button class="secondary" id="logout-btn">Log Out</button>
      </div>

      <div class="tech-section" id="tech-section">
        <div class="tech-section-title">Technicians</div>
        <div id="tech-map" class="tech-map"></div>
        <div id="tech-list">Loading&hellip;</div>
        <div id="tech-detail" class="hidden"></div>
      </div>

      <div class="summary-strip" id="summary-strip">Loading&hellip;</div>

      <div class="filter-row" id="filter-row">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="active">Active</button>
        <button class="filter-btn" data-filter="completed">Completed</button>
        <button class="filter-btn" data-filter="cancelled">Cancelled</button>
      </div>

      <div class="status error hidden" id="dashboard-status"></div>
      <div id="job-list"></div>
    </div>
  </div>

  <!-- Loads Google's map code so the Techs section can show on-duty
       locations. Same key/restriction as index.html and tech.html. -->
  <script>
    // Defined before the Maps script tag on purpose -- see index.html
    // for why (Maps sometimes calls this before it exists otherwise).
    let lastTechData = null;
    function initMaps() {
      if (lastTechData) updateTechMap(lastTechData);
    }
  </script>
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCZEELZJOoritTGoNx44ajUfsYdUNa8vAM&callback=initMaps&loading=async" async defer></script>

  <script>
    // Same deliberate simple-deterrent pattern as tech.html's PIN --
    // not real security, see project docs. No longer reuses Demian's
    // technician PIN (0214) -- changed 2026-09-26 per the security plan's
    // requirement that admin have its own separate PIN, and to match the
    // ADMIN_PIN_HASH value already hashed and live in Vercel (see
    // claude/TNT-Roadside-Security-Architecture-Plan.md, Step 1/3) -- this
    // constant and that hash now have to be kept in sync by hand any time
    // either one changes.
    const ADMIN_PIN = '1234';

    const SERVICE_LABELS = {
      flat_tire: 'Flat Tire',
      dead_battery: 'Dead Battery',
      lockout: 'Lockout',
      fuel_delivery: 'Fuel Delivery'
    };
    const STATUS_LABELS = {
      requested: 'Requested',
      dispatched: 'Accepted',
      en_route: 'En Route',
      arrived: 'On Site',
      completed: 'Completed',
      cancelled: 'Cancelled'
    };
    const ACTIVE_STATUSES = ['requested', 'dispatched', 'en_route', 'arrived'];
    const AFTER_HOURS_RATE = 125;
    const AFTER_HOURS_HOLD_HOURS = 3;

    const pinScreen = document.getElementById('pin-screen');
    const pinInput = document.getElementById('pin-input');
    const pinStatus = document.getElementById('pin-status');
    const pinSubmit = document.getElementById('pin-submit');
    const dashboardScreen = document.getElementById('dashboard-screen');
    const refreshBtn = document.getElementById('refresh-btn');
    const logoutBtn = document.getElementById('logout-btn');
    const summaryStrip = document.getElementById('summary-strip');
    const filterRow = document.getElementById('filter-row');
    const dashboardStatus = document.getElementById('dashboard-status');
    const jobListEl = document.getElementById('job-list');
    const techMapEl = document.getElementById('tech-map');
    const techListEl = document.getElementById('tech-list');
    const techDetailEl = document.getElementById('tech-detail');

    let allJobs = [];
    let currentFilter = 'all';
    // Which job's detail/action panel is open, if any (added 2026-09-26,
    // same tap-to-expand pattern as selectedTechName above).
    let selectedJobId = null;
    // Polling for the open job's message thread (added 2026-09-26, see
    // the .job-messages CSS comment above for why). Separate from
    // techPollInterval -- this only runs while a job's detail panel is
    // actually open, and follows whichever job that is.
    let jobMessagesPollInterval = null;
    let jobMessagesPollJobId = null;
    const JOB_MESSAGES_POLL_MS = 8000;
    let techMap = null;
    const techMarkers = {}; // tech name -> google.maps.Marker
    let techPollInterval = null;
    let selectedTechName = null; // which tech's detail panel is open, if any
    const TECH_POLL_MS = 15000;

    // Step 3 of the security plan (claude/TNT-Roadside-Security-Architecture-Plan.md):
    // same pattern as tech.html's matching function -- ask the server for
    // a signed admin token using the PIN just typed in, and store it
    // alongside the existing sessionStorage flag. Nothing checks this
    // token yet, so it's purely additive: a failed request never blocks
    // login, which still runs on the unchanged client-side ADMIN_PIN
    // check above.
    async function fetchAndStoreAdminToken(pin) {
      try {
        const response = await fetch('/api/all-jobs', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pin })
        });
        if (!response.ok) return;
        const result = await response.json();
        if (result.token) {
          sessionStorage.setItem('tnt-admin-token', result.token);
        }
      } catch (err) {
        console.warn('Could not fetch admin session token (non-blocking):', err.message);
      }
    }

    // Step 4 of the security plan (claude/TNT-Roadside-Security-Architecture-Plan.md):
    // same helper as tech.html's matching function -- attach the stored
    // admin token as a standard Authorization: Bearer header on every
    // API call below. The server only LOGS what it finds right now
    // (see api/_auth.js's logTokenCheck), nothing rejects a request
    // yet, so this changes nothing about whether these calls succeed.
    function authHeaders() {
      const token = sessionStorage.getItem('tnt-admin-token');
      return token ? { Authorization: 'Bearer ' + token } : {};
    }

    function unlock() {
      if (pinInput.value === ADMIN_PIN) {
        sessionStorage.setItem('tnt-admin-unlocked', '1');
        pinScreen.classList.add('hidden');
        dashboardScreen.classList.remove('hidden');
        refreshAll();
        startTechPolling();
        fetchAndStoreAdminToken(pinInput.value);
      } else {
        pinStatus.textContent = 'Wrong PIN.';
        pinInput.value = '';
      }
    }
    pinSubmit.addEventListener('click', unlock);
    pinInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') unlock(); });

    if (sessionStorage.getItem('tnt-admin-unlocked') === '1') {
      pinScreen.classList.add('hidden');
      dashboardScreen.classList.remove('hidden');
      refreshAll();
      startTechPolling();
    }

    logoutBtn.addEventListener('click', () => {
      sessionStorage.removeItem('tnt-admin-unlocked');
      sessionStorage.removeItem('tnt-admin-token');
      allJobs = [];
      selectedJobId = null;
      pinInput.value = '';
      pinStatus.textContent = '';
      dashboardScreen.classList.add('hidden');
      pinScreen.classList.remove('hidden');
      stopTechPolling();
      stopJobMessagesPolling();
    });

    refreshBtn.addEventListener('click', refreshAll);

    function refreshAll() {
      loadJobs();
      loadTechStatus();
    }

    function startTechPolling() {
      if (techPollInterval) return;
      techPollInterval = setInterval(loadTechStatus, TECH_POLL_MS);
    }
    function stopTechPolling() {
      if (techPollInterval) {
        clearInterval(techPollInterval);
        techPollInterval = null;
      }
    }

    function relativeTime(isoString) {
      if (!isoString) return 'no location yet';
      const diffMs = Date.now() - new Date(isoString).getTime();
      const mins = Math.round(diffMs / 60000);
      if (mins < 1) return 'just now';
      if (mins === 1) return '1 min ago';
      if (mins < 60) return mins + ' min ago';
      const hours = Math.round(mins / 60);
      if (hours === 1) return '1 hour ago';
      if (hours < 24) return hours + ' hours ago';
      const days = Math.round(hours / 24);
      return days + (days === 1 ? ' day ago' : ' days ago');
    }

    async function loadTechStatus() {
      try {
        const response = await fetch('/api/tech-status', { headers: authHeaders() });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || 'Request failed');
        renderTechs(result.technicians || []);
      } catch (err) {
        console.error('loadTechStatus failed:', err);
        techListEl.innerHTML = '<div class="no-jobs">Could not load technician status.</div>';
      }
    }

    function renderTechs(technicians) {
      lastTechData = technicians;
      techListEl.innerHTML = '';
      if (technicians.length === 0) {
        techListEl.innerHTML = '<div class="no-jobs">No technicians on file.</div>';
      } else {
        technicians.forEach(tech => {
          const row = document.createElement('div');
          row.className = 'tech-row';
          row.innerHTML =
            '<div>' +
              '<div class="tech-name">' + tech.name + '</div>' +
              '<div class="tech-meta">' + (tech.on_duty ? 'Updated ' + relativeTime(tech.location_updated_at) : 'Off duty') + '</div>' +
            '</div>' +
            '<span class="tech-pill ' + (tech.on_duty ? 'on' : 'off') + '">' + (tech.on_duty ? 'On Duty' : 'Off Duty') + '</span>';
          // Tap a tech to open/close their detail panel (status + manual
          // on-duty override). Tapping the already-open one closes it.
          row.addEventListener('click', () => {
            selectedTechName = (selectedTechName === tech.name) ? null : tech.name;
            renderTechDetail(technicians);
          });
          techListEl.appendChild(row);
        });
      }
      updateTechMap(technicians);
      renderTechDetail(technicians);
    }

    // Shows the selected technician's current status plus a manual
    // On Duty / Off Duty override. This override writes straight to the
    // same `on_duty` column tech.html's own login/logout flow writes (via
    // the same /api/tech-heartbeat endpoint) -- it changes whether this
    // tech is offered new jobs and whether they show on the map, but it
    // does NOT force-log-out their phone: if tech.html is still unlocked
    // on their end, they can still see and accept jobs from the shared
    // job list regardless of what this flips. No remote-lock exists today
    // -- flagged here in the UI, not just in chat, since it's the kind of
    // thing an admin would reasonably assume this button does.
    // Renders the "what are they working right now" line in a tech's
    // detail panel. tech.current_job comes from api/tech-status.js,
    // which only knows about a job once it's actually been ACCEPTED
    // (technician_id + accepted_at are set at accept time, not job
    // creation -- see api/accept-job.js's comment). A tech who's been
    // dispatched a job but hasn't tapped Accept yet won't show here on
    // purpose -- "what are they working" means what they've taken on,
    // not what they were suggested.
    function currentJobHtml(currentJob) {
      if (!currentJob) {
        return '<div class="tech-detail-note">No active job right now.</div>';
      }
      const service = SERVICE_LABELS[currentJob.service_type] || currentJob.service_type;
      const statusLabel = STATUS_LABELS[currentJob.status] || currentJob.status;
      const elapsed = currentJob.accepted_at
        ? relativeTime(currentJob.accepted_at) + ' since accepted'
        : 'accepted time unknown'; // shouldn't happen for a job with technician_id set post-fix
      const who = currentJob.customer_name || 'unnamed customer';
      const where = currentJob.customer_address ? ' — ' + currentJob.customer_address : '';
      const more = currentJob.other_jobs_count > 0
        ? '<div class="tech-detail-meta">+' + currentJob.other_jobs_count +
          ' more job' + (currentJob.other_jobs_count === 1 ? '' : 's') + ' queued</div>'
        : '';
      return (
        '<div class="tech-detail-meta"><strong>' + service + '</strong> — ' + statusLabel + '</div>' +
        '<div class="tech-detail-meta">' + who + where + '</div>' +
        '<div class="tech-detail-note">' + elapsed + '</div>' +
        more
      );
    }

    function renderTechDetail(technicians) {
      if (!selectedTechName) {
        techDetailEl.classList.add('hidden');
        techDetailEl.innerHTML = '';
        return;
      }
      const tech = technicians.find(t => t.name === selectedTechName);
      if (!tech) {
        // Selected tech no longer in the list for some reason -- close.
        selectedTechName = null;
        techDetailEl.classList.add('hidden');
        techDetailEl.innerHTML = '';
        return;
      }
      techDetailEl.classList.remove('hidden');
      techDetailEl.innerHTML =
        '<div class="tech-detail-name">' + tech.name + '</div>' +
        '<div class="tech-detail-meta">' +
          (tech.on_duty ? 'On duty — updated ' + relativeTime(tech.location_updated_at) : 'Off duty') +
        '</div>' +
        currentJobHtml(tech.current_job) +
        '<button class="' + (tech.on_duty ? 'off-duty-btn' : '') + '" id="duty-toggle-btn">' +
          (tech.on_duty ? 'Set Off Duty' : 'Set On Duty') +
        '</button>' +
        '<span class="status error" id="duty-toggle-status" style="display:inline-block;"></span>';

      document.getElementById('duty-toggle-btn').addEventListener('click', () => toggleDuty(tech));
    }

    async function toggleDuty(tech) {
      const btn = document.getElementById('duty-toggle-btn');
      const statusEl = document.getElementById('duty-toggle-status');
      const nextState = !tech.on_duty;
      btn.disabled = true;
      btn.textContent = 'Updating\u2026';
      statusEl.textContent = '';
      try {
        const response = await fetch('/api/tech-heartbeat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', ...authHeaders() },
          body: JSON.stringify({ tech_name: tech.name, on_duty: nextState })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || 'Request failed');
        await loadTechStatus();
      } catch (err) {
        console.error('toggleDuty failed:', err);
        statusEl.textContent = 'Could not update: ' + err.message;
        btn.disabled = false;
        btn.textContent = tech.on_duty ? 'Set Off Duty' : 'Set On Duty';
      }
    }

    function updateTechMap(technicians) {
      if (!techMapEl || !window.google || !google.maps) return;

      const onDutyWithLocation = technicians.filter(
        t => t.on_duty && t.current_lat != null && t.current_lng != null
      );

      if (!techMap) {
        techMap = new google.maps.Map(techMapEl, {
          center: { lat: 30.3674, lng: -89.0928 }, // Gulfport, MS -- default view before any tech has reported in
          zoom: 11,
          disableDefaultUI: true,
          zoomControl: true,
        });
      }

      // Drop markers for techs who are no longer on duty (or gone).
      Object.keys(techMarkers).forEach(name => {
        if (!onDutyWithLocation.find(t => t.name === name)) {
          techMarkers[name].setMap(null);
          delete techMarkers[name];
        }
      });

      onDutyWithLocation.forEach(tech => {
        const position = { lat: tech.current_lat, lng: tech.current_lng };
        if (techMarkers[tech.name]) {
          techMarkers[tech.name].setPosition(position);
        } else {
          techMarkers[tech.name] = new google.maps.Marker({
            position,
            map: techMap,
            title: tech.name,
          });
        }
      });

      if (onDutyWithLocation.length === 1) {
        techMap.setCenter({ lat: onDutyWithLocation[0].current_lat, lng: onDutyWithLocation[0].current_lng });
        techMap.setZoom(13);
      } else if (onDutyWithLocation.length > 1) {
        const bounds = new google.maps.LatLngBounds();
        onDutyWithLocation.forEach(t => bounds.extend({ lat: t.current_lat, lng: t.current_lng }));
        techMap.fitBounds(bounds, 48);
      }
    }

    filterRow.addEventListener('click', (e) => {
      const btn = e.target.closest('.filter-btn');
      if (!btn) return;
      currentFilter = btn.dataset.filter;
      filterRow.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b === btn));
      renderList();
    });

    // Tap a job card to open/close its Cancel/Reassign panel. Delegated
    // (one listener, not one per card) since jobListEl gets rebuilt on
    // every renderList() call. Ignores taps on the phone number link and
    // on anything already inside an open detail panel -- those have
    // their own handlers wired in wireJobDetailHandlers below.
    jobListEl.addEventListener('click', (e) => {
      if (e.target.closest('a')) return;
      if (e.target.closest('.job-detail')) return;
      const card = e.target.closest('.job-card');
      if (!card || !card.dataset.jobId) return;
      const wasOpen = selectedJobId === card.dataset.jobId;
      selectedJobId = wasOpen ? null : card.dataset.jobId;
      if (wasOpen) stopJobMessagesPolling();
      renderList();
    });

    // Admin control added 2026-09-26, per Demian: "what happens if the
    // tech can't make it, loses his phone, quits" -- admin shouldn't be
    // stuck waiting on the tech's own phone to cancel a job or hand it
    // to someone else. Cancel reuses the same /api/cancel-job endpoint
    // tech.html's Cancel Job button already calls (releases the Stripe
    // hold, no money captured). Reassign reuses /api/accept-job with an
    // admin_reassign flag (see that file's 2026-09-26 comment) instead
    // of a new endpoint, to stay under Vercel's 12-function cap.
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function stopJobMessagesPolling() {
      if (jobMessagesPollInterval) {
        clearInterval(jobMessagesPollInterval);
        jobMessagesPollInterval = null;
        jobMessagesPollJobId = null;
      }
    }

    function startJobMessagesPolling(jobId) {
      if (jobMessagesPollJobId === jobId) return; // already polling this exact job
      stopJobMessagesPolling();
      jobMessagesPollJobId = jobId;
      loadJobMessages(jobId);
      jobMessagesPollInterval = setInterval(() => loadJobMessages(jobId), JOB_MESSAGES_POLL_MS);
    }

    async function loadJobMessages(jobId) {
      try {
        const response = await fetch('/api/messages?job_id=' + encodeURIComponent(jobId), { headers: authHeaders() });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || 'Request failed');
        renderJobMessages(result.messages || []);
      } catch (err) {
        console.error('admin loadJobMessages failed:', err);
        const el = document.getElementById('job-detail-messages');
        if (el) el.innerHTML = '<div class="job-detail-row">Could not load messages.</div>';
      }
    }

    function renderJobMessages(messages) {
      // The panel may have been closed (or the job filtered out of view)
      // since this fetch started -- just drop the update rather than
      // erroring on a missing element.
      const el = document.getElementById('job-detail-messages');
      if (!el) return;
      if (messages.length === 0) {
        el.innerHTML = '<div class="job-detail-row">No messages yet.</div>';
        return;
      }
      el.innerHTML = messages.map(m =>
        '<div class="job-msg ' + (m.sender === 'tech' ? 'tech' : 'customer') + '">' +
          '<span class="job-msg-sender">' + (m.sender === 'tech' ? 'Tech' : 'Customer') + '</span>' +
          escapeHtml(m.body) +
        '</div>'
      ).join('');
      el.scrollTop = el.scrollHeight;
    }

    function currentTechName(job) {
      if (!job.technician_id) return 'Unassigned';
      const tech = (lastTechData || []).find(t => t.id === job.technician_id);
      return tech ? tech.name : 'Assigned (not currently on duty)';
    }

    function jobDetailHtml(job) {
      // Shown for every job regardless of status -- reviewing what was
      // actually said on a completed or cancelled job is still useful
      // (a dispute, a "why did this get cancelled" question later).
      const messagesHtml =
        '<div class="job-detail-row"><strong>Messages</strong></div>' +
        '<div class="job-messages" id="job-detail-messages"><div class="job-detail-row">Loading…</div></div>';

      if (!ACTIVE_STATUSES.includes(job.status)) {
        return '<div class="job-detail">' + messagesHtml +
          '<div class="job-detail-row">This job is ' + (STATUS_LABELS[job.status] || job.status).toLowerCase() +
          ' — no further actions available.</div></div>';
      }

      const onDutyTechs = (lastTechData || []).filter(t => t.on_duty);
      const reassignOptions = onDutyTechs.length
        ? onDutyTechs.map(t =>
            '<option value="' + t.name + '"' + (t.id === job.technician_id ? ' selected' : '') + '>' +
            t.name + '</option>'
          ).join('')
        : '<option value="">No on-duty technicians</option>';

      return (
        '<div class="job-detail">' +
          messagesHtml +
          '<div class="job-detail-row"><strong>Assigned:</strong> ' + currentTechName(job) + '</div>' +
          '<div class="job-detail-actions">' +
            '<select id="job-detail-reassign-select">' + reassignOptions + '</select>' +
            '<button id="job-detail-reassign-btn"' + (onDutyTechs.length ? '' : ' disabled') + '>Reassign</button>' +
          '</div>' +
          '<div class="job-detail-actions">' +
            '<button class="danger" id="job-detail-cancel-btn">Cancel Job &amp; Release Hold</button>' +
          '</div>' +
          '<span class="status error" id="job-detail-status" style="display:inline-block;"></span>' +
        '</div>'
      );
    }

    function wireJobDetailHandlers(job) {
      // Messages panel is present whether or not this job has action
      // buttons (a completed/cancelled job still shows its message
      // history), so this always runs, ahead of the action-button guard
      // below.
      startJobMessagesPolling(job.id);

      const cancelBtn = document.getElementById('job-detail-cancel-btn');
      const reassignBtn = document.getElementById('job-detail-reassign-btn');
      const selectEl = document.getElementById('job-detail-reassign-select');
      const statusEl = document.getElementById('job-detail-status');
      if (!statusEl) return; // job was completed/cancelled -- no action panel to wire

      if (cancelBtn) {
        cancelBtn.addEventListener('click', async () => {
          cancelBtn.disabled = true;
          if (reassignBtn) reassignBtn.disabled = true;
          statusEl.textContent = 'Cancelling…';
          try {
            const response = await fetch('/api/cancel-job', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', ...authHeaders() },
              body: JSON.stringify({ job_id: job.id })
            });
            const result = await response.json();
            if (!response.ok) throw new Error(result.error || 'Request failed');
            // Leave the panel open (selectedJobId untouched) -- the
            // re-render below will show it in its new "Cancelled, no
            // actions available" state, with the message history still
            // visible rather than the panel just vanishing.
            await loadJobs();
          } catch (err) {
            console.error('admin cancel-job failed:', err);
            statusEl.textContent = 'Could not cancel: ' + err.message;
            cancelBtn.disabled = false;
            if (reassignBtn) reassignBtn.disabled = false;
          }
        });
      }

      if (reassignBtn) {
        reassignBtn.addEventListener('click', async () => {
          const techName = selectEl.value;
          if (!techName) return;
          reassignBtn.disabled = true;
          if (cancelBtn) cancelBtn.disabled = true;
          statusEl.textContent = 'Reassigning…';
          try {
            const response = await fetch('/api/accept-job', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', ...authHeaders() },
              body: JSON.stringify({ job_id: job.id, tech_name: techName, admin_reassign: true })
            });
            const result = await response.json();
            if (!response.ok) throw new Error(result.error || 'Request failed');
            // Stays open (selectedJobId untouched) so the updated
            // "Assigned:" line is visible right away.
            await loadJobs();
          } catch (err) {
            console.error('admin reassign failed:', err);
            statusEl.textContent = 'Could not reassign: ' + err.message;
            reassignBtn.disabled = false;
            if (cancelBtn) cancelBtn.disabled = false;
          }
        });
      }
    }

    function customerOf(job) {
      const c = job.customers;
      if (!c) return null;
      return Array.isArray(c) ? (c[0] || null) : c;
    }

    function formatPrice(job) {
      if (job.price != null) return '$' + Number(job.price).toFixed(2);
      if (job.status === 'completed') return '$0.00'; // shouldn't normally happen
      return 'Up to $' + (AFTER_HOURS_RATE * AFTER_HOURS_HOLD_HOURS).toFixed(2) + ' held';
    }

    async function loadJobs() {
      dashboardStatus.classList.add('hidden');
      summaryStrip.textContent = 'Loading…';
      try {
        const response = await fetch('/api/all-jobs', { headers: authHeaders() });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || 'Request failed');
        allJobs = result.jobs || [];
        renderSummary();
        renderList();
      } catch (err) {
        console.error('loadJobs failed:', err);
        summaryStrip.textContent = '';
        dashboardStatus.classList.remove('hidden');
        dashboardStatus.textContent = 'Could not load jobs: ' + err.message;
      }
    }

    function renderSummary() {
      const completed = allJobs.filter(j => j.status === 'completed');
      const capturedTotal = completed.reduce((sum, j) => sum + (Number(j.price) || 0), 0);
      const counts = {};
      allJobs.forEach(j => { counts[j.status] = (counts[j.status] || 0) + 1; });
      const activeCount = ACTIVE_STATUSES.reduce((sum, s) => sum + (counts[s] || 0), 0);

      summaryStrip.innerHTML =
        '<div class="summary-total">$' + capturedTotal.toFixed(2) + '</div>' +
        '<div class="summary-sub">captured across ' + completed.length + ' completed job' + (completed.length === 1 ? '' : 's') + '</div>' +
        '<div class="status-counts">' +
          '<span class="status-count"><strong>' + activeCount + '</strong> active</span>' +
          '<span class="status-count"><strong>' + (counts.completed || 0) + '</strong> completed</span>' +
          '<span class="status-count"><strong>' + (counts.cancelled || 0) + '</strong> cancelled</span>' +
        '</div>';
    }

    function renderList() {
      const filtered = allJobs.filter(j => {
        if (currentFilter === 'all') return true;
        if (currentFilter === 'active') return ACTIVE_STATUSES.includes(j.status);
        return j.status === currentFilter;
      });

      jobListEl.innerHTML = '';
      if (filtered.length === 0) {
        jobListEl.innerHTML = '<div class="no-jobs">No jobs in this view.</div>';
        return;
      }

      filtered.forEach(job => {
        const customer = customerOf(job);
        const statusLabel = STATUS_LABELS[job.status] || job.status;
        const whenLabel = job.status === 'completed' && job.completed_at
          ? 'Completed ' + new Date(job.completed_at).toLocaleString()
          : 'Dispatched ' + new Date(job.created_at).toLocaleString();

        const item = document.createElement('div');
        item.className = 'job-card';
        item.dataset.jobId = job.id;
        const isOpen = selectedJobId === job.id;
        item.innerHTML =
          '<div class="job-service">' + (SERVICE_LABELS[job.service_type] || job.service_type) +
          '<span class="job-badge ' + job.status + '">' + statusLabel + '</span></div>' +
          '<div class="job-price">' + formatPrice(job) + '</div>' +
          '<div class="job-meta">' + whenLabel + '</div>' +
          (job.customer_address ? '<div class="job-meta">' + job.customer_address + '</div>' : '') +
          (customer ? '<div class="job-meta">' + customer.name +
            (customer.phone ? ' &middot; <a href="tel:' + customer.phone + '" style="color:#93c5fd;">' + customer.phone + '</a>' : '') +
            '</div>' : '') +
          (isOpen ? jobDetailHtml(job) : '');
        jobListEl.appendChild(item);
        if (isOpen) wireJobDetailHandlers(job);
      });
    }
  </script>

  <script>
    (function () {
      const banner = document.getElementById('install-banner');
      const sub = document.getElementById('install-banner-sub');
      const installBtn = document.getElementById('install-btn');
      const dismissBtn = document.getElementById('install-dismiss');
      let deferredPrompt = null;

      const isStandalone =
        window.matchMedia('(display-mode: standalone)').matches ||
        window.navigator.standalone === true;
      const dismissed = localStorage.getItem('tnt-admin-install-dismissed') === '1';
      const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;

      if (!isStandalone && !dismissed && isIOS) {
        // Safari has no programmatic install prompt -- show instructions
        // instead of a button that would do nothing when tapped.
        installBtn.style.display = 'none';
        sub.textContent = 'Tap the Share icon below, then "Add to Home Screen."';
        banner.style.display = 'flex';
      }

      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        if (!isStandalone && !dismissed) {
          banner.style.display = 'flex';
        }
      });

      installBtn.addEventListener('click', async () => {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        await deferredPrompt.userChoice;
        deferredPrompt = null;
        banner.style.display = 'none';
      });

      dismissBtn.addEventListener('click', () => {
        banner.style.display = 'none';
        localStorage.setItem('tnt-admin-install-dismissed', '1');
      });

      window.addEventListener('appinstalled', () => {
        banner.style.display = 'none';
      });
    })();
  </script>
</body>
</html>
