<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TNT Roadside &mdash; Technician</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .card {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: center;
      text-align: center;
    }
    h1 { font-size: 22px; font-weight: 800; }
    h1 span { color: #E01010; }
    p.sub { color: #94a3b8; font-size: 14px; }
    input[type="password"], input[type="tel"] {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #f8fafc;
      font-size: 18px;
      text-align: center;
      letter-spacing: 4px;
    }
    button {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: none;
      background: #2563EB;
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    button.success {
      background: #16a34a;
      color: #ffffff;
    }
    button:disabled { opacity: 0.5; cursor: default; }
    button.secondary {
      background: transparent;
      border: 1px solid #334155;
      color: #94a3b8;
    }
    button.danger {
      background: transparent;
      border: 1px solid #f87171;
      color: #f87171;
    }
    .status {
      font-size: 14px;
      color: #94a3b8;
      min-height: 20px;
    }
    .status.error { color: #f87171; }
    .status.ok { color: #4ade80; }
    .hidden { display: none; }
    .location-line {
      font-size: 13px;
      color: #64748b;
    }
    #location-screen { width: 100%; }
    #job-section { width: 100%; margin-top: 24px; }
    .no-job { color: #64748b; font-size: 14px; }
    .job-card {
      width: 100%;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 16px;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .job-service { font-size: 18px; font-weight: 800; }
    .job-price { color: #2563EB; font-weight: 700; font-size: 16px; }
    .job-meta { font-size: 13px; color: #94a3b8; }
    .tracking-line {
      font-size: 12px;
      color: #4ade80;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .tracking-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4ade80;
      display: inline-block;
    }
    .job-actions {
      display: flex;
      gap: 10px;
      margin-top: 4px;
    }
    .job-actions button { flex: 1; }
    .job-address {
      font-size: 13px;
      color: #cbd5e1;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px;
    }
    .job-directions {
      display: inline-block;
      text-align: center;
      text-decoration: none;
      padding: 10px;
      border-radius: 8px;
      background: #2563EB;
      color: #ffffff;
      font-weight: 700;
      font-size: 14px;
    }
    .install-banner {
      display: none;
      align-items: center;
      gap: 12px;
      width: 100%;
      background: #1e293b;
      border: 1px solid #2563EB;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 20px;
    }
    .install-banner-text {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .install-banner-text strong {
      font-size: 14px;
      color: #f8fafc;
    }
    .install-banner-text span {
      font-size: 13px;
      color: #94a3b8;
      line-height: 1.4;
    }
    .install-banner-btn {
      width: auto;
      flex-shrink: 0;
      background: #2563EB;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .install-banner-close {
      width: auto;
      flex-shrink: 0;
      background: none;
      border: none;
      color: #64748b;
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
      padding: 4px;
    }
  </style>
  <link rel="manifest" href="/tech-manifest.json">
  <meta name="theme-color" content="#0f172a">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TNT Tech">
</head>
<body>
  <div class="card">
    <h1>TNT <span>Roadside</span></h1>

    <div class="install-banner" id="install-banner">
      <div class="install-banner-text">
        <strong>Install TNT Tech</strong>
        <span id="install-banner-sub">Add this to your home screen for one-tap access.</span>
      </div>
      <button class="install-banner-btn" id="install-btn">Install</button>
      <button class="install-banner-close" id="install-dismiss" aria-label="Dismiss">&times;</button>
    </div>

    <div id="pin-screen">
      <p class="sub">Technician access only</p>
      <input type="password" id="pin-input" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="PIN">
      <div class="status error" id="pin-status"></div>
      <button id="pin-submit">Unlock</button>
    </div>

    <div id="location-screen" class="hidden">
      <p class="sub">Tap to share your current location. Customers see this as your live ETA.</p>
      <button id="update-btn">Update My Location</button>
      <div class="status" id="location-status"></div>
      <div class="location-line" id="last-updated"></div>

      <div id="job-section">
        <div id="job-loading" class="no-job">Checking for an active job...</div>
        <div id="no-job-message" class="no-job hidden">No active job right now.</div>
        <div id="job-card" class="job-card hidden">
          <div class="job-service" id="job-service"></div>
          <div class="job-price" id="job-price"></div>
          <div class="job-meta" id="job-meta"></div>
          <div class="job-address" id="job-address"></div>
          <a href="#" target="_blank" rel="noopener" class="job-directions hidden" id="job-directions">Get Directions</a>
          <div class="tracking-line hidden" id="tracking-indicator">
            <span class="tracking-dot"></span>Sharing your live location with the customer
          </div>
          <div class="job-actions">
            <button id="complete-btn" class="success">Complete Job</button>
            <button id="cancel-btn" class="danger">Cancel Job</button>
          </div>
          <div class="status" id="job-action-status"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // Deliberately simple deterrent, not real security -- see project docs.
    // Anyone determined enough to read this page's source can find the PIN.
    // Fine for now: single technician (Demian), page isn't linked publicly.
    const TECH_PIN = '5817';

    const SUPABASE_URL = 'https://psqzoyjszykdgjkcbrrt.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_UwjdR9XkwjTC8seuP5GXsA_QimEYwZ1';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const SERVICE_LABELS = {
      flat_tire: 'Flat Tire',
      dead_battery: 'Dead Battery',
      lockout: 'Lockout',
      fuel_delivery: 'Fuel Delivery'
    };

    const pinScreen = document.getElementById('pin-screen');
    const locationScreen = document.getElementById('location-screen');
    const pinInput = document.getElementById('pin-input');
    const pinStatus = document.getElementById('pin-status');
    const pinSubmit = document.getElementById('pin-submit');
    const updateBtn = document.getElementById('update-btn');
    const locationStatus = document.getElementById('location-status');
    const lastUpdated = document.getElementById('last-updated');

    const jobLoading = document.getElementById('job-loading');
    const noJobMessage = document.getElementById('no-job-message');
    const jobCard = document.getElementById('job-card');
    const jobService = document.getElementById('job-service');
    const jobPrice = document.getElementById('job-price');
    const jobMeta = document.getElementById('job-meta');
    const jobAddress = document.getElementById('job-address');
    const jobDirections = document.getElementById('job-directions');
    const trackingIndicator = document.getElementById('tracking-indicator');
    const completeBtn = document.getElementById('complete-btn');
    const cancelBtn = document.getElementById('cancel-btn');
    const jobActionStatus = document.getElementById('job-action-status');

    let currentJob = null;
    let watchId = null;
    let lastGpsWriteAt = 0;
    // Continuous GPS tracking (while a job is active) can fire many times a
    // minute -- throttle actual database writes so it doesn't hammer
    // Supabase or burn data. 5s is frequent enough for a live-feeling
    // customer ETA without writing on every single GPS event.
    const GPS_WRITE_MIN_INTERVAL_MS = 5000;

    function unlock() {
      if (pinInput.value === TECH_PIN) {
        sessionStorage.setItem('tnt-tech-unlocked', '1');
        pinScreen.classList.add('hidden');
        locationScreen.classList.remove('hidden');
        startJobPolling();
      } else {
        pinStatus.textContent = 'Wrong PIN.';
        pinInput.value = '';
      }
    }

    pinSubmit.addEventListener('click', unlock);
    pinInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') unlock();
    });

    // Stay unlocked for the rest of this browser tab/session -- avoids
    // re-entering the PIN every time if he leaves the page open on his phone.
    if (sessionStorage.getItem('tnt-tech-unlocked') === '1') {
      pinScreen.classList.add('hidden');
      locationScreen.classList.remove('hidden');
      startJobPolling();
    }

    // ---- shared location push (used by both the manual button and the
    //      automatic continuous tracking below) ----
    async function pushLocation(latitude, longitude) {
      const { error } = await supabaseClient
        .from('technicians')
        .update({
          current_lat: latitude,
          current_lng: longitude,
          location_updated_at: new Date().toISOString()
        })
        .eq('active', true);
      if (error) throw error;
    }

    updateBtn.addEventListener('click', () => {
      if (!navigator.geolocation) {
        locationStatus.className = 'status error';
        locationStatus.textContent = 'Geolocation not supported on this device.';
        return;
      }
      updateBtn.disabled = true;
      locationStatus.className = 'status';
      locationStatus.textContent = 'Getting your location...';

      navigator.geolocation.getCurrentPosition(
        async (pos) => {
          try {
            await pushLocation(pos.coords.latitude, pos.coords.longitude);
            locationStatus.className = 'status ok';
            locationStatus.textContent = 'Location updated.';
            lastUpdated.textContent = 'Last updated: ' + new Date().toLocaleTimeString();
          } catch (err) {
            console.error('Location update failed:', err);
            locationStatus.className = 'status error';
            locationStatus.textContent = 'Something went wrong saving your location.';
          } finally {
            updateBtn.disabled = false;
          }
        },
        (err) => {
          console.error('Geolocation error:', err);
          locationStatus.className = 'status error';
          locationStatus.textContent = 'Could not get your location. Check location permissions.';
          updateBtn.disabled = false;
        },
        { enableHighAccuracy: true, timeout: 12000 }
      );
    });

    // ---- active job: shows whatever job is currently open (not completed
    //      or cancelled), lets the tech close it out ----
    function startJobPolling() {
      refreshActiveJob();
      // Catches a newly-dispatched job while this page is left open.
      setInterval(refreshActiveJob, 10000);
    }

    async function refreshActiveJob() {
      try {
        const { data, error } = await supabaseClient
          .from('active_jobs_view')
          .select('id, service_type, price, status, payment_status, created_at, customer_lat, customer_lng, customer_address')
          .order('created_at', { ascending: false })
          .limit(1);
        if (error) throw error;

        jobLoading.classList.add('hidden');
        const job = data && data[0];

        if (!job) {
          if (currentJob) stopContinuousTracking();
          currentJob = null;
          jobCard.classList.add('hidden');
          noJobMessage.classList.remove('hidden');
          return;
        }

        noJobMessage.classList.add('hidden');
        jobCard.classList.remove('hidden');

        const isNewJob = !currentJob || currentJob.id !== job.id;
        currentJob = job;

        jobService.textContent = SERVICE_LABELS[job.service_type] || job.service_type;
        jobPrice.textContent = job.price != null
          ? ('$' + Number(job.price).toFixed(2))
          : 'After-hours job (est. $125 held)';
        jobMeta.textContent = 'Dispatched ' + new Date(job.created_at).toLocaleTimeString();

        // Where to actually go. A typed address is shown as-is and linked
        // straight to Maps directions; a GPS-based job has coordinates but
        // no address text, so those get used instead. If neither is on
        // file (shouldn't normally happen), tell the tech to call.
        if (job.customer_address) {
          jobAddress.textContent = job.customer_address;
          jobDirections.href = 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(job.customer_address);
          jobDirections.classList.remove('hidden');
        } else if (job.customer_lat != null && job.customer_lng != null) {
          jobAddress.textContent = 'GPS location (' + job.customer_lat.toFixed(5) + ', ' + job.customer_lng.toFixed(5) + ')';
          jobDirections.href = 'https://www.google.com/maps/dir/?api=1&destination=' + job.customer_lat + ',' + job.customer_lng;
          jobDirections.classList.remove('hidden');
        } else {
          jobAddress.textContent = 'No location on file -- call the customer.';
          jobDirections.classList.add('hidden');
        }

        if (isNewJob) startContinuousTracking();
      } catch (err) {
        console.error('refreshActiveJob failed:', err);
        jobLoading.classList.add('hidden');
      }
    }

    // ---- continuous GPS tracking while a job is open, so the customer's
    //      tracking screen shows a genuinely live ETA rather than only
    //      updating when the manual button is tapped ----
    function startContinuousTracking() {
      if (!navigator.geolocation || watchId !== null) return;
      trackingIndicator.classList.remove('hidden');
      watchId = navigator.geolocation.watchPosition(
        (pos) => {
          const now = Date.now();
          if (now - lastGpsWriteAt < GPS_WRITE_MIN_INTERVAL_MS) return;
          lastGpsWriteAt = now;
          pushLocation(pos.coords.latitude, pos.coords.longitude).then(() => {
            lastUpdated.textContent = 'Last updated: ' + new Date().toLocaleTimeString();
          }).catch((err) => {
            console.error('Continuous location push failed:', err);
          });
        },
        (err) => console.error('watchPosition error:', err),
        { enableHighAccuracy: true, maximumAge: 5000, timeout: 15000 }
      );
    }

    function stopContinuousTracking() {
      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
      }
      trackingIndicator.classList.add('hidden');
    }

    // ---- Complete Job / Cancel Job -- these are the buttons that actually
    //      move money (capture the Stripe hold, or release it) ----
    completeBtn.addEventListener('click', () => handleJobAction('complete'));
    cancelBtn.addEventListener('click', () => handleJobAction('cancel'));

    async function handleJobAction(action) {
      if (!currentJob) return;
      completeBtn.disabled = true;
      cancelBtn.disabled = true;
      jobActionStatus.className = 'status';
      jobActionStatus.textContent = action === 'complete' ? 'Capturing payment...' : 'Releasing hold...';

      try {
        const endpoint = action === 'complete' ? '/api/complete-job' : '/api/cancel-job';
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ job_id: currentJob.id })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || 'Request failed');

        jobActionStatus.className = 'status ok';
        jobActionStatus.textContent = action === 'complete'
          ? 'Job completed -- payment captured.'
          : 'Job cancelled -- hold released.';
        stopContinuousTracking();
        currentJob = null;
        setTimeout(refreshActiveJob, 1500);
      } catch (err) {
        console.error(action + ' failed:', err);
        jobActionStatus.className = 'status error';
        jobActionStatus.textContent = 'Something went wrong: ' + err.message;
        completeBtn.disabled = false;
        cancelBtn.disabled = false;
      }
    }
  </script>

  <script>
    (function () {
      const banner = document.getElementById('install-banner');
      const sub = document.getElementById('install-banner-sub');
      const installBtn = document.getElementById('install-btn');
      const dismissBtn = document.getElementById('install-dismiss');
      let deferredPrompt = null;

      const isStandalone =
        window.matchMedia('(display-mode: standalone)').matches ||
        window.navigator.standalone === true;
      const dismissed = localStorage.getItem('tnt-tech-install-dismissed') === '1';
      const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;

      if (!isStandalone && !dismissed && isIOS) {
        // Safari has no programmatic install prompt -- show instructions
        // instead of a button that would do nothing when tapped.
        installBtn.style.display = 'none';
        sub.textContent = 'Tap the Share icon below, then "Add to Home Screen."';
        banner.style.display = 'flex';
      }

      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        if (!isStandalone && !dismissed) {
          banner.style.display = 'flex';
        }
      });

      installBtn.addEventListener('click', async () => {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        await deferredPrompt.userChoice;
        deferredPrompt = null;
        banner.style.display = 'none';
      });

      dismissBtn.addEventListener('click', () => {
        banner.style.display = 'none';
        localStorage.setItem('tnt-tech-install-dismissed', '1');
      });

      window.addEventListener('appinstalled', () => {
        banner.style.display = 'none';
      });
    })();
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch((err) => {
          console.error('Service worker registration failed:', err);
        });
      });
    }
  </script>
</body>
</html>
